name: Release extension (zip only)

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # コミットメッセージをチェックして、'release:' で始まっていない場合はスキップする
      - name: Check commit message
        id: check_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ ! "$COMMIT_MSG" =~ ^release: ]]; then
            echo "Commit message does not start with 'release:', skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Commit message starts with 'release:', proceeding with release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check_commit.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        if: steps.check_commit.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check_commit.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Chrome と Firefox 用の zip ファイルをビルドする
      - name: Build zips (Chrome + Firefox)
        if: steps.check_commit.outputs.skip != 'true'
        run: |
          pnpm --filter extension zip

      # package.json の version を取得して tag / リリース名に使用する
      - name: Get version
        if: steps.check_commit.outputs.skip != 'true'
        id: get_version
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_commit.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          # wxt の zip 出力先パターンに合わせて調整してください
          files: |
            apps/extension/.output/*-chrome.zip
            apps/extension/.output/*-firefox.zip
            apps/extension/.output/*-sources.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
