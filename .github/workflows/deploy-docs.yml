# docsify のドキュメントサイト（apps/docs/site）を GitHub Pages にデプロイするワークフロー
# docsify はブラウザで Markdown を描画するため、ビルドは不要。リンク検証だけ行ってそのまま公開する。
name: Deploy Documents to Pages

on:
  # `main` ブランチへのプッシュで実行されます（ドキュメントに関係する変更のみ）
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/deploy-docs.yml"

  # Actions タブから手動でワークフローを実行できるようにします
  workflow_dispatch:

# GITHUB_TOKEN の権限を設定して、GitHub Pages へのデプロイを許可します
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限し、進行中の実行と最新のキューの間の実行をスキップします。
# ただし、進行中の実行はキャンセルしません（本番デプロイの完了を許可するため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 検証 + アップロードジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check internal links
        run: node apps/docs/scripts/check-links.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/site

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
